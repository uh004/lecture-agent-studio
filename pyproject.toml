[project]
name = "lecture-agent-api"
version = "1.1.0"
description = "FastAPI backend for Lecture Agent Studio"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.117,<1",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "openai>=1.100,<3",
    "tavily-python>=0.7,<1",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.6,<2",
    "python-pptx>=1.0,<2",
    "pillow>=11,<13",
    "imageio-ffmpeg>=0.6,<1",
    "vercel>=0.5,<1",
    "uvicorn>=0.35,<1",
]

[tool.vercel]
entrypoint = "main:app"
